name: Publish game feed demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack verified demo runtime
        run: |
          mkdir -p public
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          target = Path('public').resolve()
          archives = sorted(Path('.').glob('site-part-*.zip'))
          assert len(archives) == 5, 'Waiting for all five runtime archives'
          for archive in archives:
              with ZipFile(archive) as z:
                  for name in z.namelist():
                      assert (target / name).resolve().is_relative_to(target), name
                  z.extractall(target)
          assert (target / 'index.html').is_file()
          (target / '.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
