<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0e17"><title>随想游 · 刷到就玩</title><link rel="stylesheet" href="style.css?v=discovery-1"></head><body>
<aside class="desktop-intro"><a class="brand" href="#">随想游<span>可玩原型发现页</span></a><h1>刷到好玩的，<br>改成自己的。</h1><p>先刷一刷，看到感兴趣的点开预览。<br>向上滑动，发现下一个可玩版本。</p><div class="proof">1 个格斗母体<br><strong>3 个主题版本</strong><small>均可试玩，非多玩法库</small></div><p class="keyboard">滚轮 / ↑ ↓ 切换<br>点画面先看 12 秒演示<br>喜欢再试玩，或者定制</p><button id="tour" class="quiet">自动演示切换</button></aside>
<main class="phone" aria-label="可滑动游戏发现页"><header><strong>随想游</strong><span>发现可玩的想法</span><button id="saved-open" aria-label="查看收藏">收藏 <b id="saved-count">0</b></button></header><div id="feed" class="feed" tabindex="0" aria-label="上下滑动切换游戏"></div><nav class="bottom"><span class="selected">发现</span><button id="mine">我的想法</button><span id="position">01 / 03</span></nav></main>
<aside class="desktop-nav"><button id="previous" aria-label="上一个原型">↑</button><span>滑动发现</span><button id="next" aria-label="下一个原型">↓</button></aside>
<dialog id="custom"><form id="custom-form"><div class="dialog-head"><div><small>从这个版本开始</small><h2 id="custom-title">定制我的版本</h2></div><button type="button" class="close" aria-label="关闭定制">×</button></div><p class="caption">名称修改可即时试玩。图片与文字需求先保存为创意草稿，AI 制作尚未接入此示例。</p><div class="names"><label>己方名字<input id="player-name" maxlength="20" placeholder="输入你的名字"></label><label>对手名字<input id="enemy-name" maxlength="20" placeholder="输入对手名字"></label></div><label>想改成什么<textarea id="idea" rows="3" maxlength="800" placeholder="例如：一位穿宇航服的猫，与拿公文包的狗来一场对决"></textarea></label><label>参考图片（仅在本浏览器预览）<input id="reference" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="reference-image" hidden alt="本地参考图预览"><div class="dialog-actions"><button type="button" id="save-draft" class="quiet">保存想法</button><button class="primary" type="submit">应用名字并试玩</button></div><p id="form-status" role="status"></p></form></dialog>
<dialog id="library"><div class="dialog-head"><h2 id="library-title">我的想法</h2><button class="close" aria-label="关闭列表">×</button></div><div id="library-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js?v=discovery-1"></script></body></html>
